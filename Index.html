<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MARMITARIA DEGGUST - Painel da Franquia</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4">

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCT-DpI06em24o7cjgV67x2GaHom7BzLpM",
      authDomain: "marmitaria-deggust.firebaseapp.com",
      projectId: "marmitaria-deggust",
      storageBucket: "marmitaria-deggust.firebasestorage.app",
      messagingSenderId: "750433597063",
      appId: "1:750433597063:web:b82cabcb8111411cd46a22",
      measurementId: "G-7CYHMY89YV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <header class="max-w-5xl mx-auto flex items-center justify-between pb-6 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <img src="./logo.png" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100&q=80';" class="w-12 h-12 rounded-2xl border border-amber-500/40">
      <div>
        <h1 class="font-black text-lg text-white">MARMITARIA DEGGUST</h1>
        <p class="text-xs text-amber-400 font-semibold">Painel Geral (Pedidos & Cardápio)</p>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto mt-6 space-y-8">

    <!-- SEÇÃO: GERENCIAR CARDÁPIO -->
    <div class="bg-slate-950 border border-slate-800 rounded-3xl p-5 space-y-4">
      <h2 class="text-sm font-bold text-amber-400 flex items-center gap-2">
        <i data-lucide="utensils" class="w-4 h-4"></i> Gerenciar Cardápio dos Clientes
      </h2>

      <form onsubmit="addMenuItem(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
        <input type="text" id="menuTitle" required placeholder="Nome do Prato / Marmita" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white">
        <input type="text" id="menuDesc" placeholder="Acompanhamentos / Descrição" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white">
        <input type="number" step="0.01" id="menuPrice" required placeholder="Preço (R$)" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white">
        <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl p-2.5 transition">
          + Adicionar Prato
        </button>
      </form>

      <!-- LISTA DE PRATOS ATUAIS -->
      <div id="ownerMenuList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 pt-2">
        <!-- Renderizado via JS -->
      </div>
    </div>

    <!-- SEÇÃO: PEDIDOS EM TEMPO REAL -->
    <div class="bg-slate-950 border border-slate-800 rounded-3xl p-5 space-y-4">
      <h2 class="text-sm font-bold text-emerald-400 flex items-center gap-2">
        <i data-lucide="shopping-bag" class="w-4 h-4"></i> Pedidos Recebidos
      </h2>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400">
              <th class="p-3">Cliente</th>
              <th class="p-3">Endereço</th>
              <th class="p-3">Itens</th>
              <th class="p-3">Valor</th>
              <th class="p-3">Pagamento</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y divide-slate-800/60">
            <tr><td colspan="6" class="p-6 text-center text-slate-500">Conectando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      
      // ESCUTA PEDIDOS
      db.collection("pedidos_franquia").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        const orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderOrders(orders);
      });

      // ESCUTA CARDÁPIO
      db.collection("cardapio_franquia").onSnapshot((snapshot) => {
        const menu = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderOwnerMenu(menu);
      });
    });

    // ADICIONAR PRATO AO CARDÁPIO
    async function addMenuItem(e) {
      e.preventDefault();
      const title = document.getElementById('menuTitle').value.trim();
      const desc = document.getElementById('menuDesc').value.trim();
      const price = parseFloat(document.getElementById('menuPrice').value);

      await db.collection("cardapio_franquia").add({ title, desc, price });
      
      document.getElementById('menuTitle').value = '';
      document.getElementById('menuDesc').value = '';
      document.getElementById('menuPrice').value = '';
    }

    // EXCLUIR PRATO DO CARDÁPIO
    async function deleteMenuItem(id) {
      if(confirm("Deseja remover este prato do cardápio?")) {
        await db.collection("cardapio_franquia").doc(id).delete();
      }
    }

    function renderOwnerMenu(menu) {
      const list = document.getElementById('ownerMenuList');
      if (menu.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 col-span-full">Nenhum prato cadastrado no cardápio.</p>`;
        return;
      }

      list.innerHTML = menu.map(item => `
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl flex justify-between items-center text-xs">
          <div>
            <p class="font-bold text-white">${item.title}</p>
            <p class="text-[10px] text-emerald-400 font-bold">R$ ${parseFloat(item.price).toFixed(2)}</p>
          </div>
          <button onclick="deleteMenuItem('${item.id}')" class="text-rose-500 hover:text-rose-400 p-1">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('ordersTableBody');
      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">Aguardando novos pedidos...</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(ord => `
        <tr class="hover:bg-slate-900/50">
          <td class="p-3 font-bold text-white">${ord.clientName}<br><span class="text-[10px] text-slate-400 font-normal">${ord.clientPhone || ''}</span></td>
          <td class="p-3 text-slate-300">${ord.clientAddress}</td>
          <td class="p-3 text-amber-400 font-semibold">${ord.itemName}</td>
          <td class="p-3 font-bold text-emerald-400">R$ ${parseFloat(ord.amount || 0).toFixed(2)}</td>
          <td class="p-3"><span class="bg-slate-900 border border-slate-800 px-2 py-1 rounded-lg text-[10px]">${ord.paymentMethod}</span></td>
          <td class="p-3">
            <select onchange="updateStatus('${ord.id}', this.value)" class="bg-slate-900 border border-slate-800 text-[10px] rounded-lg p-1 font-bold ${
              ord.status === 'Entregue' ? 'text-emerald-400' : 'text-amber-400'
            }">
              <option value="Pendente" ${ord.status === 'Pendente' ? 'selected' : ''}>Pendente</option>
              <option value="Em Rota" ${ord.status === 'Em Rota' ? 'selected' : ''}>Em Rota</option>
              <option value="Entregue" ${ord.status === 'Entregue' ? 'selected' : ''}>Entregue</option>
            </select>
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    async function updateStatus(id, status) {
      await db.collection("pedidos_franquia").doc(id).update({ status });
    }
  </script>
</body>
</html>
