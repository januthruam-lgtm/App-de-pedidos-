<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Vendedor - MARMITARIA DEGGUST</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-full border border-orange-500 object-cover" onerror="this.src='https://via.placeholder.com/40'">
        <div>
          <h1 class="font-bold text-lg text-orange-500">PAINEL DO VENDEDOR</h1>
          <p class="text-xs text-slate-400">MARMITARIA DEGGUST</p>
        </div>
      </div>
      <span class="bg-green-500/10 text-green-400 text-xs px-2.5 py-1 rounded-full flex items-center gap-1 border border-green-500/20">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Online
      </span>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Form de Cadastro de Marmita -->
    <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
      <h2 class="text-base font-bold text-white mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="text-orange-500"></i> Cadastrar Nova Marmita
      </h2>

      <form id="formMarmita" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nome do Prato / Marmita</label>
          <input type="text" id="nomePrato" placeholder="Ex: Marmita Executiva de Frango" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Descrição dos Acompanhamentos</label>
          <textarea id="descricaoPrato" placeholder="Ex: Arroz, feijão, frango grelhado e salada" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-orange-500 h-20"></textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Preço (R$)</label>
          <input type="number" step="0.01" id="precoPrato" placeholder="18.00" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">URL da Imagem (Opcional)</label>
          <input type="url" id="imagemPrato" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-orange-500">
        </div>

        <button type="submit" id="btnSalvar" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-orange-600/20">
          <i data-lucide="save"></i> Salvar e Publicar no Cardápio
        </button>
      </form>
    </section>

    <!-- Lista de Marmitas Cadastradas -->
    <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
      <h2 class="text-base font-bold text-white flex items-center gap-2">
        <i data-lucide="utensils" class="text-orange-500"></i> Cardápio Atual
      </h2>
      <div id="listaCardapio" class="space-y-3">
        <p class="text-xs text-slate-500 text-center py-4">Carregando cardápio...</p>
      </div>
    </section>

  </main>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuração conectada ao seu Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCT-DpI06em24o7cjgV67x2GaHom7BzLpM",
      authDomain: "marmitaria-deggust.firebaseapp.com",
      projectId: "marmitaria-deggust",
      storageBucket: "marmitaria-deggust.firebasestorage.app",
      messagingSenderId: "750433597063",
      appId: "1:750433597063:web:b82cabcb8111411cd46a22",
      measurementId: "G-7CYHMY89YV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();

    // Salvar Novo Prato
    const form = document.getElementById('formMarmita');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerText = "Salvando...";

      try {
        await addDoc(collection(db, "cardapio"), {
          nome: document.getElementById('nomePrato').value,
          descricao: document.getElementById('descricaoPrato').value,
          preco: parseFloat(document.getElementById('precoPrato').value),
          imagem: document.getElementById('imagemPrato').value || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500",
          criadoEm: serverTimestamp()
        });
        form.reset();
        alert("Prato adicionado com sucesso!");
      } catch (err) {
        alert("Erro ao salvar: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="save"></i> Salvar e Publicar no Cardápio`;
        lucide.createIcons();
      }
    });

    // Listar e Excluir Pratos do Cardápio
    onSnapshot(collection(db, "cardapio"), (snapshot) => {
      const container = document.getElementById('listaCardapio');
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Nenhum prato cadastrado ainda.</p>`;
        return;
      }

      snapshot.forEach((docItem) => {
        const item = docItem.data();
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-700/60 p-3 rounded-xl flex items-center justify-between gap-3";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${item.imagem}" class="w-12 h-12 rounded-lg object-cover bg-slate-800">
            <div>
              <h3 class="font-bold text-sm text-white">${item.nome}</h3>
              <p class="text-xs text-orange-400 font-semibold">R$ ${item.preco.toFixed(2)}</p>
            </div>
          </div>
          <button onclick="deletarPrato('${docItem.id}')" class="text-red-400 hover:text-red-300 p-2 rounded-lg bg-red-500/10 border border-red-500/20">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    });

    window.deletarPrato = async (id) => {
      if (confirm("Deseja realmente remover este prato do cardápio?")) {
        await deleteDoc(doc(db, "cardapio", id));
      }
    };
  </script>
</body>
</html>
